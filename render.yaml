services:
  - type: web
    name: tecman-pruebas
    runtime: python
    plan: free
    branch: openclaw/marketing-it-invgate-gap-20261026
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TECMAN_ENVIRONMENT
        value: staging
      - key: TECMAN_EXTERNAL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DEMO_PASSWORD
        sync: false
      - key: TECMAN_BUILD_MARKER
        value: marketing-it-staging-20261027
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COMPRAS_PASSWORD
        sync: false
      - key: CENTRAL_PASSWORD
        sync: false
      - key: SYH_PASSWORD
        sync: false
      - key: PROVEEDOR_PASSWORD
        sync: false
      - key: MATAFUEGOS_DEMO_PASSWORD
        sync: false
      - key: SUCURSAL_PASSWORD_PREFIX
        sync: false
      - key: OFICINA_PASSWORD
        sync: false
      - key: RENDER
        value: "true"
      - key: BACKUP_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RITA_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tecman-pruebas-db
          property: connectionString
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
      - key: ADMIN_SUCURSAL_ACCESS_EMAILS
        sync: false
      - key: LOGISTICA_LOCAL_LOGIN_ENABLED
        value: "false"
      - key: LOGISTICA_PORTAL_TEST_MODE
        value: "false"
      - key: LOGISTICA_SMTP_MOCK
        value: "true"
      - key: ENABLE_NON_PRODUCTIVE_PURCHASES
        value: "false"
      - key: ENABLE_LIBRARY_CLEANING_SUPPLIES
        value: "false"
      - key: SESSION_LIFETIME_MINUTES
        value: "480"
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: tecman-pruebas-db
    plan: free
    databaseName: tecman_pruebas
    user: tecman_pruebas
    ipAllowList: []
