<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Logística de Insumos{% endblock %}</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.bar{background:#173b57;color:#fff;padding:1rem}.bar a{color:#fff;margin-right:1rem}.wrap{max-width:1100px;margin:auto;padding:1rem}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:1rem;margin-bottom:1rem;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}table{border-collapse:collapse;width:100%}th,td{padding:.65rem;border-bottom:1px solid #e5e9ef;text-align:left}input,select,textarea,button{font:inherit;padding:.55rem;border:1px solid #b9c3cf;border-radius:7px}button{background:#176b87;color:#fff;border:0;cursor:pointer}.pill{display:inline-block;padding:.2rem .55rem;border-radius:999px;background:#e8f2f6}.warn{color:#a54213;font-weight:700}.flash{background:#fff3cd;padding:.7rem;border-radius:8px;margin-bottom:.8rem}@media(max-width:650px){.wrap{padding:.6rem}th,td{font-size:.85rem;padding:.45rem}.bar form{display:inline}}
</style></head><body>
<header class="bar"><strong>Portal Logística de Insumos</strong>{% if session.get('logistica_role') %}<a href="{{ url_for('logistica_panel') if session.get('logistica_role') != 'garin' else url_for('logistica_garin') }}">Inicio</a><form method="post" action="{{ url_for('logistica_logout') }}" style="display:inline"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button>Salir</button></form>{% endif %}</header>
<main class="wrap">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
