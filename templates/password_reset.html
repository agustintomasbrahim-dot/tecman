{% extends "base.html" %}
{% block title %}Tecman - Nueva contraseña{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 48px auto;">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 32px; margin-bottom: 8px;">&#128273;</div>
        <h2 style="font-size: 18px;">Nueva contraseña</h2>
        <p style="color: #9ca3af; font-size: 13px; margin-top: 4px;">Usá al menos 10 caracteres</p>
    </div>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" minlength="10" required>
        </div>
        <div class="form-group">
            <label>Repetir contraseña</label>
            <input type="password" name="confirm_password" minlength="10" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Actualizar contraseña</button>
    </form>
</div>
{% endblock %}
