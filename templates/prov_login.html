{% extends "base.html" %}
{% block title %}Tecman - Proveedor{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -30px; right: -30px; font-size: 120px; opacity: 0.03; transform: rotate(-15deg);">&#127939;</div>
    <div style="text-align: center; margin-bottom: 24px; position: relative;">
        <div style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(245,158,11,0.05)); border: 1px solid rgba(245,158,11,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px;">&#128295;</div>
        <h2 style="font-size: 20px;">Portal Proveedor</h2>
        <p style="color: #475569; margin-top: 6px; font-size: 13px;">Ingrese para ver sus trabajos</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required placeholder="Ej: gustavo" autocapitalize="none" autocorrect="off">
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" required placeholder="Ingrese su contrasena">
        </div>
        <button type="submit" class="btn btn-block" style="padding: 14px; font-size: 16px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; box-shadow: 0 4px 16px rgba(245,158,11,0.3);">Ingresar</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #333; font-size: 13px; text-decoration: none;">&larr; Volver</a>
    </div>
</div>
{% endblock %}
