{% extends "base.html" %}
{% block title %}Tecman - Admin{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -30px; right: -30px; font-size: 120px; opacity: 0.03; transform: rotate(-15deg);">&#9881;</div>
    <div style="text-align: center; margin-bottom: 24px; position: relative;">
        <div style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(139,92,246,0.05)); border: 1px solid rgba(139,92,246,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px;">&#9881;</div>
        <h2 style="font-size: 20px;">Panel de Gestion</h2>
        <p style="color: #475569; margin-top: 6px; font-size: 13px;">Acceso administradores</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required placeholder="Ingrese su usuario" autocapitalize="none">
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" required placeholder="Ingrese su contrasena">
        </div>
        <button type="submit" class="btn btn-block" style="padding: 14px; font-size: 16px; background: linear-gradient(135deg, #a78bfa, #7c3aed); color: white; box-shadow: 0 4px 16px rgba(139,92,246,0.35);">Ingresar</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #333; font-size: 13px; text-decoration: none;">&larr; Volver</a>
    </div>
</div>
{% endblock %}
