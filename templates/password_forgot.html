{% extends "base.html" %}
{% block title %}Tecman - Recuperar acceso{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 48px auto;">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 32px; margin-bottom: 8px;">&#128274;</div>
        <h2 style="font-size: 18px;">Recuperar acceso</h2>
        <p style="color: #9ca3af; font-size: 13px; margin-top: 4px;">Ingresá tu usuario o correo electrónico</p>
    </div>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Usuario o correo electrónico</label>
            <input type="text" name="usuario" required autocapitalize="none" autocorrect="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar instrucciones</button>
    </form>
    <div style="text-align: center; margin-top: 16px;">
        <a href="{{ url_for('admin_login') }}" style="color: #9ca3af; font-size: 12px; text-decoration: none;">&larr; Volver</a>
    </div>
</div>
{% endblock %}
