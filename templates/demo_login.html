<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECMAN · Entorno de prueba</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5f8; color: #17212b; }
    main { width: min(90vw, 390px); padding: 32px; border-radius: 16px; background: white; box-shadow: 0 14px 40px rgba(23,33,43,.12); }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { color: #566573; line-height: 1.45; }
    label { display: block; margin: 24px 0 8px; font-weight: 700; }
    input, button { box-sizing: border-box; width: 100%; min-height: 46px; border-radius: 8px; font: inherit; }
    input { padding: 10px 12px; border: 1px solid #aeb8c2; }
    button { margin-top: 14px; border: 0; background: #174ea6; color: white; font-weight: 700; cursor: pointer; }
    .error { padding: 10px 12px; border-radius: 8px; background: #fde8e8; color: #9b1c1c; }
    small { display: block; margin-top: 20px; color: #77838f; }
  </style>
</head>
<body>
  <main>
    <h1>TECMAN · Pruebas</h1>
    <p>Entorno aislado para validar las colas de Mantenimiento, Marketing e IT.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" autocomplete="off">
      <label for="password">Contraseña de acceso</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">Ingresar</button>
    </form>
    <small>No contiene datos productivos.</small>
  </main>
</body>
</html>
