<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tecman{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            color: #1a1a2e;
            min-height: 100vh;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 24px; }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 24px;
            display: flex; align-items: center; gap: 12px;
        }
        .header .logo {
            width: 36px; height: 36px;
            background: #e63946;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; color: white;
        }
        .header h1 { font-size: 18px; font-weight: 800; color: #1a1a2e; letter-spacing: 1px; }
        .header .subtitle { font-size: 11px; color: #9ca3af; margin-top: 1px; }

        /* Cards */
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin: 12px 0;
        }
        .card h2 { color: #1a1a2e; font-size: 18px; }
        .card h3 { color: #374151; font-size: 15px; }

        /* Buttons */
        .btn {
            display: inline-block; padding: 10px 20px; border-radius: 8px;
            border: none; font-size: 14px; font-weight: 600; cursor: pointer;
            text-decoration: none; text-align: center; transition: all 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: #e63946; color: white; }
        .btn-primary:hover { background: #d62839; }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-block { display: block; width: 100%; }
        .btn-outline { background: #fff; border: 1px solid #e5e7eb; color: #6b7280; }
        .btn-outline:hover { border-color: #e63946; color: #e63946; }
        .btn.is-saving {
            background: #2563eb !important;
            color: white !important;
            opacity: 0.95;
        }
        .btn.is-saved {
            background: #059669 !important;
            color: white !important;
            opacity: 1;
        }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #6b7280; }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
            font-size: 14px; background: #fff; color: #1a1a2e; font-family: inherit;
            transition: border-color 0.15s;
        }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #e63946; box-shadow: 0 0 0 3px rgba(230,57,70,0.08);
        }
        .form-group textarea { height: 100px; resize: vertical; }

        /* Flash */
        .flash {
            padding: 12px 16px; border-radius: 8px; margin: 12px 0;
            background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;
            font-size: 14px;
        }

        /* Badges */
        .badge {
            display: inline-block; padding: 3px 8px; border-radius: 6px;
            font-size: 11px; font-weight: 600;
        }
        .badge-nuevo { background: #dbeafe; color: #1d4ed8; }
        .badge-abierto { background: #fef3c7; color: #b45309; }
        .badge-enprogreso { background: #ede9fe; color: #6d28d9; }
        .badge-pendiente { background: #fef3c7; color: #b45309; }
        .badge-resuelto { background: #d1fae5; color: #065f46; }
        .badge-cerrado { background: #f3f4f6; color: #6b7280; }
        .badge-p1 { background: #fee2e2; color: #dc2626; }
        .badge-p2 { background: #fef3c7; color: #b45309; }
        .badge-p3 { background: #dbeafe; color: #1d4ed8; }
        .badge-p4 { background: #d1fae5; color: #065f46; }

        /* Navigation */
        .nav {
            display: flex; gap: 2px; padding: 0 16px;
            background: #fff; border-bottom: 1px solid #e5e7eb;
            overflow-x: auto;
        }
        .nav a {
            color: #6b7280; text-decoration: none; padding: 12px 14px;
            font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent;
            transition: all 0.15s; white-space: nowrap;
        }
        .nav a:hover { color: #e63946; border-bottom-color: #e63946; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
        th { color: #9ca3af; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr { transition: background 0.1s; }
        tr:hover { background: #fafafa; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0; }
        .stat-card {
            background: #fff; border: 1px solid #e5e7eb;
            border-radius: 12px; padding: 16px; text-align: center;
        }
        .stat-card .number { font-size: 28px; font-weight: 800; color: #1a1a2e; }
        .stat-card .label { font-size: 11px; color: #9ca3af; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Photos */
        .foto-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; margin: 2px; border: 1px solid #e5e7eb; }
        .foto-full { max-width: 100%; border-radius: 10px; margin: 8px 0; border: 1px solid #e5e7eb; }

        /* Info box */
        .info-box {
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 8px; padding: 12px; font-weight: 600; color: #e63946; font-size: 14px;
        }

        /* Success icon */
        .success-icon {
            width: 56px; height: 56px; border-radius: 50%;
            background: #059669; display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 12px; color: white;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header { padding: 12px 14px; }
            .container { padding: 12px; }
            .card { padding: 16px; }
            .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-card { padding: 10px; }
            .stat-card .number { font-size: 22px; }
            table { font-size: 12px; }
            th, td { padding: 8px 6px; }
            .nav { padding: 0 8px; }
            .nav a { padding: 10px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">T</div>
        <div>
            <h1>TECMAN</h1>
            <div class="subtitle">Grupo Dabra</div>
        </div>
    </div>
    {% block nav %}{% endblock %}
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script>
    document.querySelectorAll('form').forEach(function(form) {
        form.addEventListener('submit', function() {
            var btn = form.querySelector('button[type="submit"], input[type="submit"]');
            if (!btn) return;
            var texto = (btn.innerText || btn.value || '').trim().toLowerCase();
            var etiquetas = ['guardar', 'enviar', 'registrar', 'actualizar'];
            var aplica = etiquetas.some(function(t) { return texto.indexOf(t) !== -1; }) || btn.classList.contains('save-feedback-btn');
            if (!aplica) return;

            var guardando = btn.getAttribute('data-saving') || 'Guardando...';
            var guardado = btn.getAttribute('data-saved') || 'Guardado ✓';

            if (btn.tagName === 'INPUT') {
                btn.dataset.originalValue = btn.value;
                btn.value = guardando;
            } else {
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = guardando;
            }
            btn.classList.remove('is-saved');
            btn.classList.add('is-saving');
            btn.disabled = true;

            setTimeout(function() {
                if (btn.tagName === 'INPUT') btn.value = guardado;
                else btn.innerHTML = guardado;
                btn.classList.remove('is-saving');
                btn.classList.add('is-saved');
            }, 300);
        });
    });
    </script>
</body>
</html>
