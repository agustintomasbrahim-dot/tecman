<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tecman{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111111;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container { max-width: 920px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            background: #000000;
            color: white;
            border-bottom: 3px solid #e63946;
            padding: 16px 24px;
            display: flex; align-items: center; gap: 14px;
        }
        .header .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #e63946, #c1121f);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; color: white;
            box-shadow: 0 0 20px rgba(230,57,70,0.4);
        }
        .header h1 { font-size: 22px; font-weight: 900; letter-spacing: 3px; }
        .header .subtitle { font-size: 11px; opacity: 0.5; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }

        /* Glass Cards */
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            padding: 24px;
            margin: 16px 0;
        }
        .card h2, .card h3 { color: #f1f5f9; }

        /* Buttons */
        .btn {
            display: inline-block; padding: 12px 28px; border-radius: 10px;
            border: none; font-size: 15px; font-weight: 700; cursor: pointer;
            text-decoration: none; text-align: center; transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: #e63946;
            color: white;
            box-shadow: 0 4px 12px rgba(230,57,70,0.4);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(230,57,70,0.5); background: #d62839; }
        .btn-success {
            background: #2d6a4f;
            color: white;
            box-shadow: 0 4px 12px rgba(45,106,79,0.4);
        }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 7px 16px; font-size: 13px; border-radius: 8px; }
        .btn-block { display: block; width: 100%; }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
        }
        .btn-outline:hover { border-color: #e63946; color: #e63946; background: rgba(230,57,70,0.05); }

        /* Forms */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #333333; border-radius: 8px;
            font-size: 16px; background: #0a0a0a; color: #e2e8f0;
            transition: all 0.2s; font-family: inherit;
        }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230,57,70,0.15);
        }
        .form-group textarea { height: 110px; resize: vertical; }

        /* Flash */
        .flash {
            padding: 14px 18px; border-radius: 8px; margin: 16px 0;
            background: rgba(16,185,129,0.15); color: #10b981;
            border: 1px solid rgba(16,185,129,0.3);
        }

        /* Badges */
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-nuevo { background: rgba(14,165,233,0.15); color: #38bdf8; }
        .badge-abierto { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .badge-enprogreso { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .badge-pendiente { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .badge-resuelto { background: rgba(16,185,129,0.15); color: #34d399; }
        .badge-cerrado { background: rgba(100,116,139,0.15); color: #94a3b8; }
        .badge-p1 { background: rgba(239,68,68,0.2); color: #f87171; }
        .badge-p2 { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .badge-p3 { background: rgba(14,165,233,0.2); color: #38bdf8; }
        .badge-p4 { background: rgba(16,185,129,0.2); color: #34d399; }

        /* Navigation */
        .nav {
            display: flex; gap: 4px; padding: 8px 16px;
            background: #1a1a1a; border-bottom: 1px solid #333333;
            overflow-x: auto;
        }
        .nav a {
            color: #94a3b8; text-decoration: none; padding: 8px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500;
            transition: all 0.2s; white-space: nowrap;
        }
        .nav a:hover { background: #333333; color: #f1f5f9; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
        th { color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr { transition: background 0.15s; }
        tr:hover { background: rgba(230,57,70,0.05); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
        .stat-card {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 12px; padding: 18px; text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 800; color: #e63946; }
        .stat-card .label { font-size: 11px; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Photos */
        .foto-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin: 2px; border: 2px solid #2a2a2a; }
        .foto-full { max-width: 100%; border-radius: 12px; margin: 10px 0; border: 2px solid #2a2a2a; }

        /* Info box */
        .info-box {
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.2);
            border-radius: 10px; padding: 14px; font-weight: 600; color: #e63946;
        }

        /* Success icon */
        .success-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: #2d6a4f;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; margin: 0 auto 16px;
            box-shadow: 0 4px 16px rgba(16,185,129,0.4);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header { padding: 12px 14px; }
            .header h1 { font-size: 18px; letter-spacing: 2px; }
            .header .logo { width: 36px; height: 36px; font-size: 18px; }
            .container { padding: 10px; }
            .card { padding: 16px; border-radius: 12px; }
            .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .stat-card { padding: 12px; }
            .stat-card .number { font-size: 22px; }
            table { font-size: 12px; }
            th, td { padding: 8px 6px; }
            .nav { padding: 4px 8px; }
            .nav a { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">T</div>
        <div>
            <h1>TECMAN</h1>
            <div class="subtitle">Grupo Dabra - Mantenimiento</div>
        </div>
    </div>
    {% block nav %}{% endblock %}
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
