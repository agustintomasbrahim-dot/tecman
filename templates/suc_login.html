{% extends "base.html" %}
{% block title %}Tecman - Ingreso Sucursal{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -30px; right: -30px; font-size: 120px; opacity: 0.03; transform: rotate(-15deg);">&#128095;</div>
    <div style="text-align: center; margin-bottom: 24px; position: relative;">
        <div style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, rgba(230,57,70,0.2), rgba(230,57,70,0.05)); border: 1px solid rgba(230,57,70,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px;">&#127978;</div>
        <h2 style="font-size: 20px;">Ingreso Sucursal</h2>
        <p style="color: #475569; margin-top: 6px; font-size: 13px;">Ingrese sus credenciales</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required placeholder="Ej: suc078" autocapitalize="none" autocorrect="off">
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" required placeholder="Ingrese su contrasena">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 14px; font-size: 16px;">Ingresar</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #333; font-size: 13px; text-decoration: none;">&larr; Volver</a>
    </div>
</div>
{% endblock %}
