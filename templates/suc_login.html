{% extends "base.html" %}
{% block title %}Tecman - Sucursal{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 48px auto;">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 32px; margin-bottom: 8px;">&#127978;</div>
        <h2 style="font-size: 18px;">Ingreso Sucursal</h2>
        <p style="color: #9ca3af; font-size: 13px; margin-top: 4px;">Ingrese sus credenciales</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required placeholder="Ej: suc078" autocapitalize="none" autocorrect="off">
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <div style="text-align: center; margin-top: 16px;">
        <a href="{{ url_for('index') }}" style="color: #9ca3af; font-size: 12px; text-decoration: none;">&larr; Volver</a>
    </div>
</div>
{% endblock %}
